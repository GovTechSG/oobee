name: Bump Package Version

on:
  workflow_dispatch:  # Trigger manually from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for creating new branches

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get current version
        id: current
        run: |
          current_version=$(node -p "require('./package.json').version")
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bump patch version
        id: bump
        run: |
          new_version=$(npm version patch --no-git-tag-version)
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Generate oobee-client-scanner.js
        run: node dist/generateOobeeClientScanner.js

      - name: Create branch and commit changes
        # asgard-0002: pass GitHub Actions expressions through the env block
        # rather than splicing them into the shell script text. `${{ }}` is
        # textually substituted before the shell parses the line, so a value
        # containing shell metacharacters (e.g. an unsanitized package.json
        # version field) would break out of the intended command.
        # Environment variables are safe because the shell reads them after
        # parsing. Mirrors the pattern used in docker-test.yml.
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          BRANCH="bump/version-$NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json oobee-client-scanner.js oobee-client-scanner.js.sha384
          git commit -m "chore: bump version $CURRENT_VERSION → $NEW_VERSION"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Create pull request
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          gh pr create \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Automated version bump from $CURRENT_VERSION to $NEW_VERSION." \
            --head "$BRANCH" \
            --base "$BASE_REF"
