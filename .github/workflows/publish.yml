name: npm publish / unpublish
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Which npm operation to run.'
        required: true
        type: choice
        options:
          - publish
          - unpublish
        default: publish
      release_tag:
        description: '[publish] Git ref to publish — tag (e.g. 0.11.4), branch, or commit SHA. The commit at this ref is built and published; its package.json version lands on npm.'
        required: false
        type: string
      version:
        description: '[unpublish] npm version to target (e.g. 0.11.13).'
        required: false
        type: string
      skip_git_tag:
        description: '[publish] Skip creating and force-pushing the {version} and "latest" git tags after publish.'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    if: ${{ inputs.action == 'publish' }}
    runs-on: ubuntu-latest
    # Gate npm publish behind a protected GitHub Environment. The
    # environment must be configured (Settings → Environments) with a
    # required reviewer list so only designated maintainers can approve
    # the release run — repo write access is not sufficient. This closes
    # the "any actor with write access can ship arbitrary code as
    # @govtechsg/oobee" path, since workflow_dispatch on its own does not
    # gate on maintainer status.
    environment: npm-publish
    steps:
      - name: Validate release_tag input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        # The publish job checks out ``inputs.release_tag`` and runs
        # arbitrary build scripts from that ref before ``npm publish``.
        # If the ref were free-form (branch name / SHA / attacker-owned
        # tag), a repo-writer could publish arbitrary code as the
        # official npm package. Constrain it here to the semver tag
        # pattern the release automation produces, and reject anything
        # else before touching the workspace.
        run: |
          if [ -z "${RELEASE_TAG}" ]; then
            echo "::error::release_tag input is required for publish"
            exit 1
          fi
          if ! printf '%s' "${RELEASE_TAG}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::release_tag must be a semver tag (e.g. 0.11.16); got '${RELEASE_TAG}'"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci --allow-git=root
        continue-on-error: false

      - run: npm run build
        continue-on-error: false

      - name: Generate oobee-client-scanner.js
        run: node dist/generateOobeeClientScanner.js

      - name: Create and push git tags
        if: ${{ !inputs.skip_git_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -af "${VERSION}" -m "Version ${VERSION}"
          git push origin "${VERSION}" --force
          git tag -af "latest" -m "Latest release ${VERSION}"
          git push origin "latest" --force

      - run: npm publish --access public --provenance

  unpublish:
    if: ${{ inputs.action == 'unpublish' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::'version' input is required for the unpublish action"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - name: Unpublish @govtechsg/oobee@${{ inputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: npm unpublish "@govtechsg/oobee@${VERSION}"
