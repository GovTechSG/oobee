name: Build Run and Test Docker Container

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum pages to scan (keeps the test short)'
        required: false
        default: '10'
      max_duration:
        description: 'Maximum scan duration in seconds (0 = unlimited)'
        required: false
        default: '300'
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build and run Docker container
        run: |
          # Build your Docker image (replace 'oobee' and 'Dockerfile' with your image name and Dockerfile path)
          docker build -t oobee .
          # Run the Docker container (adjust any options as needed)
          docker run -dit --name oobee-container oobee
        # Ensure the Docker container is running before running the next step
        continue-on-error: true

      - name: Run Node CLI command inside the Docker container
        # asgard-0014: pass GitHub Actions context values through the env block
        # rather than splicing them into the shell script text. `${{ }}` is
        # textually substituted before the shell parses the line, so a context
        # value containing shell metacharacters (or, hypothetically, an
        # attacker-controlled github.actor) would break out of the intended
        # argument. Environment variables are safe because the shell reads
        # them after parsing. Mirrors the pattern used in docker-push-ghcr.yml.
        # A short scan that ends on its own (page cap + duration cap), with all
        # telemetry (Google Form and Sentry) disabled. Tag pushes have no
        # inputs, so they fall back to the same short defaults.
        env:
          OOBEE_SCAN_URL: ${{ vars.OOBEE_SCAN_URL }}
          OOBEE_SCAN_MAX_NUM_PAGES: ${{ inputs.max_pages || '10' }}
          OOBEE_SCAN_MAX_DURATION: ${{ inputs.max_duration || '300' }}
          OOBEE_SCAN_MAX_CONCURRENCY: ${{ vars.OOBEE_SCAN_MAX_CONCURRENCY }}
        run: |
          # Execute a short intelligent crawl; keep the output for the check below.
          docker exec \
            -e OOBEE_VERBOSE=1 \
            -e GOOGLE_SAFE_BROWSING=1 \
            -e OOBEE_FAST_CRAWLER=1 \
            -e OOBEE_DISABLE_TELEMETRY=1 \
            -e DISABLE_OOBEE_TELEMETRY=1 \
            oobee-container npm run cli -- \
              -u "$OOBEE_SCAN_URL" -c intelligent \
              -p "$OOBEE_SCAN_MAX_NUM_PAGES" \
              -l "$OOBEE_SCAN_MAX_DURATION" \
              -t "${OOBEE_SCAN_MAX_CONCURRENCY:-5}" \
              -k "Oobee Test:accessibility@tech.gov.sg" \
              -g yes 2>&1 | tee scan.log || true

      - name: Run scan again with FAMILY_DNS=1 (local SOCKS5 proxy)
        # Same short scan, but through the Family DNS local SOCKS5 proxy on
        # 127.0.0.1. Catches checks that wrongly treat the proxy's address as
        # the site's (the connected-address regression).
        if: always()
        env:
          OOBEE_SCAN_URL: ${{ vars.OOBEE_SCAN_URL }}
          OOBEE_SCAN_MAX_NUM_PAGES: ${{ inputs.max_pages || '10' }}
          OOBEE_SCAN_MAX_DURATION: ${{ inputs.max_duration || '300' }}
          OOBEE_SCAN_MAX_CONCURRENCY: ${{ vars.OOBEE_SCAN_MAX_CONCURRENCY }}
        run: |
          docker exec \
            -e OOBEE_VERBOSE=1 \
            -e GOOGLE_SAFE_BROWSING=1 \
            -e OOBEE_FAST_CRAWLER=1 \
            -e OOBEE_DISABLE_TELEMETRY=1 \
            -e DISABLE_OOBEE_TELEMETRY=1 \
            -e FAMILY_DNS=1 \
            oobee-container npm run cli -- \
              -u "$OOBEE_SCAN_URL" -c intelligent \
              -p "$OOBEE_SCAN_MAX_NUM_PAGES" \
              -l "$OOBEE_SCAN_MAX_DURATION" \
              -t "${OOBEE_SCAN_MAX_CONCURRENCY:-5}" \
              -k "Oobee Test:accessibility@tech.gov.sg" \
              -g yes 2>&1 | tee scan-familydns.log || true

      - name: Print logs
        if: always()
        run: |
          docker exec oobee-container sh -c 'cat /app/oobee/????????-????-????-????-????????????.txt' || true

      - name: Copy Results from Docker Container
        if: always()
        run: docker cp oobee-container:/app/oobee/results ./results || mkdir -p ./results

      - name: Zip Results
        if: always()
        run: zip -r results.zip ./results

      - name: Upload Zip File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.zip

      - name: Cleanup Docker container
        if: always()
        run: |
          # Stop and remove the Docker container
          docker stop oobee-container || true
          docker rm oobee-container || true

      - name: Check that pages were scanned
        # Last, so logs and results above are always kept. Fails the job if the
        # scan finished without scanning any page, e.g. a check that wrongly
        # refuses every page (as the proxied serverAddr() regression did).
        # Counts the GUI progress lines OOBEE_VERBOSE prints.
        if: always()
        run: |
          failed=0
          for log in scan.log scan-familydns.log; do
            [ -f "$log" ] || { echo "::error::$log missing"; failed=1; continue; }
            scanned=$(grep -c 'crawling::[0-9]*::scanned::' "$log" || true)
            refused=$(grep -c 'Refusing content from internal address' "$log" || true)
            echo "$log: pages scanned $scanned, refused as internal $refused"
            if [ "$scanned" -eq 0 ]; then
              echo "::error::$log: scan finished without scanning any page"
              failed=1
            fi
          done
          # Make sure the FAMILY_DNS run really went through the local proxy.
          if ! grep -q 'familyDnsProxy\] SOCKS5 .* listening on 127.0.0.1' scan-familydns.log 2>/dev/null; then
            echo "::error::scan-familydns.log: Family DNS SOCKS5 proxy did not start"
            failed=1
          fi
          exit $failed
